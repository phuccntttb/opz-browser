server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    # Landing page: always revalidate, so an edit shows up right away.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # What installed copies ask for. Must never be cached, or they would
    # miss a new release.
    location ~ ^/updates/[^/]+/update\.xml$ {
        default_type application/xml;
        add_header Cache-Control "no-store" always;
    }

    # .mar / .dmg / .tar.xz: each file name carries its build ID and never
    # changes once published, so it can be cached for good. No "always":
    # a 404 (file not uploaded yet) must not be cached for a year.
    location /updates/files/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Stable download links (symlinks to the newest installer).
    location /updates/latest/ {
        add_header Cache-Control "no-cache";
    }

    location /updates/ {
        autoindex off;
    }
}
