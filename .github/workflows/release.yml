# Build Opz from scratch on GitHub's runners and release it (scripts/release.sh):
# Linux x86_64 tarball, macOS (Apple Silicon) .dmg and Windows x64 zip, each
# with its signed update (.mar) and update.xml, published to the update server.
# Linux and Windows build on Ubuntu (Windows is cross-built, as Mozilla's and
# Zen's CI do it); macOS builds on macOS, where it is signed and notarized.
#
# Runs when a tag v* is pushed (always publishes), or by hand from the
# Actions tab ("Run workflow"), where publishing is off unless ticked.
# The first run is a full compile of Firefox (a few hours per platform). The
# compiler cache (sccache, .github/ci-sccache.sh) is kept in the Actions cache,
# also when the build fails or runs out of time, so later runs only recompile
# what changed and a too-long first build finishes on the next run.
#
# Secrets (Settings -> Secrets and variables -> Actions); scripts/ci-secrets.sh
# sets them all:
#   MAR_PRIMARY_KEY                 $FFB_ROOT/keys/mar/primary.key.pem (all jobs)
#   MAC_DEVELOPER_ID_P12            Developer ID Application cert + key, base64 .p12
#   MAC_DEVELOPER_ID_P12_PASSWORD   its password
#   APPLE_ID, APPLE_APP_PASSWORD    for notarytool (app-specific password)
#   DEPLOY_SSH_KEY                  key the server accepts for rrsync into
#                                   /srv/opz/updates only (publishing only)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, linux, mac, windows]
        default: all
      publish:
        description: Publish to the update server (installed copies will update)
        type: boolean
        default: false

permissions:
  contents: write   # GitHub Releases (ci-github-release.sh)
  actions: write   # delete superseded compiler caches (ci-sccache.sh prune)

# One run at a time per platform choice, so a manual Linux run does not wait
# hours behind a Windows one (each platform publishes to its own update
# directory). Never cancel a run that may be publishing.
concurrency:
  group: release-${{ github.event_name == 'push' && 'all' || inputs.platforms }}
  cancel-in-progress: false

env:
  # Runners have no separate system disk to protect (env.sh guard).
  OPZ_ROOT_MAX_LOSS_MB: '1000000'
  # A fresh clone on a fresh disk: skip fetch.sh's re-hash of every file.
  OPZ_VERIFY: '0'
  # Compiler cache. 3G per job keeps the three jobs inside the repo's 10 GB
  # Actions cache. The server stays up for the whole build, and if it dies
  # anyway the compiler runs without it instead of failing the build.
  SCCACHE_CACHE_SIZE: 3G
  SCCACHE_IDLE_TIMEOUT: '0'
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  SCCACHE_LOG: warn
  # Classic server mode, as Mozilla's own CI uses (outside it Firefox defaults
  # to client-side mode, which failed on Windows at gkrust-shared with
  # "sccache: encountered fatal error").
  SCCACHE_CLIENT_SIDE: 'false'
  # rrsync on the server maps "/" to /srv/opz/updates (see scripts/ci-secrets.sh).
  OPZ_UPDATE_PUBLISH: ubuntu@51.79.223.48:/
  DEPLOY_KNOWN_HOSTS: 51.79.223.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID1/G7CfViHBi6KIFdaRsBCC9J9aOJnGBISN5MlG1u1p
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  linux:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: /mnt/ffbuild/opz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make room and set up /mnt/ffbuild
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af > /dev/null || true
          df -h / /mnt
          # env.sh wants the build drive mounted at /mnt/ffbuild: bind-mount a
          # directory from whichever disk has more room.
          if [ "$(df -B1 --output=avail /mnt | tail -1)" -gt "$(df -B1 --output=avail / | tail -1)" ]; then
            store=/mnt/ffbuild-store
          else
            store=/home/runner/ffbuild-store
          fi
          sudo mkdir -p "$store" /mnt/ffbuild
          sudo chown "$USER": "$store"
          sudo mount --bind "$store" /mnt/ffbuild
          mkdir -p /mnt/ffbuild/opz
          cp -a "$GITHUB_WORKSPACE/." /mnt/ffbuild/opz/
          sudo apt-get install -y --no-install-recommends xz-utils rsync unzip > /dev/null

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ github.job }}-

      - name: Fetch Firefox, toolchains, patches
        run: |
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        id: build
        # Fails before the job's limit, so the compiler cache is still saved.
        timeout-minutes: 320
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: OPZ_BUILD=full scripts/build.sh

      # Also after a failed or timed-out build: the next run resumes from it.
      # Not from tag runs (their cache is only visible to that tag).
      - name: Stop compiler cache
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: .github/ci-sccache.sh stop

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop older compiler caches
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-sccache.sh prune sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: .github/ci-keys.sh mar

      - name: Deploy key
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy

      - name: Release
        run: |
          if [ "$PUBLISH" = true ]; then scripts/release.sh --publish; else scripts/release.sh; fi

      # The installer on the version's GitHub Release, for the website's
      # download links (.github/ci-github-release.sh).
      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-github-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opz-linux
          path: |
            /mnt/ffbuild/opz/dist/release/opz-*
            /mnt/ffbuild/opz/dist/release/site/*/update.xml
          retention-days: 14

  mac:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'mac'
    runs-on: macos-26
    timeout-minutes: 360
    defaults:
      run:
        working-directory: /Volumes/ffbuild/opz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make room and set up /Volumes/ffbuild
        working-directory: /
        run: |
          # Use the newest Xcode (Firefox 159 wants the macOS 26.5 SDK or later)
          # and delete the others to make room.
          newest="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          keep="$(cd "$newest" && pwd -P)"
          for x in /Applications/Xcode*.app; do
            [ -L "$x" ] || [ "$(cd "$x" && pwd -P)" = "$keep" ] || sudo rm -rf "$x"
          done
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"
          rm -rf ~/Library/Android
          df -h /
          # env.sh wants the repo on a volume under /Volumes. A real APFS volume
          # in the boot disk's container: a sparse disk image was ~140x slower
          # on many small files (verify-engine.sh: 26 min against 11 s on Linux).
          container="$(diskutil info -plist / | plutil -extract APFSContainerReference raw -)"
          if sudo diskutil apfs addVolume "$container" APFS ffbuild -mountpoint /Volumes/ffbuild; then
            sudo chown "$(id -u):$(id -g)" /Volumes/ffbuild
          else
            echo "::warning::could not add an APFS volume; using a (slow) sparse disk image"
            hdiutil create -quiet -size 200g -type SPARSE -fs APFS -volname ffbuild "$RUNNER_TEMP/ffbuild"
            hdiutil attach -quiet -nobrowse -mountpoint /Volumes/ffbuild "$RUNNER_TEMP/ffbuild.sparseimage"
          fi
          df -h /Volumes/ffbuild
          # No Spotlight indexing of the half-million files written there.
          sudo mdutil -i off /Volumes/ffbuild || true
          mkdir -p /Volumes/ffbuild/opz
          cp -a "$GITHUB_WORKSPACE/." /Volumes/ffbuild/opz/
          # Real rsync: macOS's openrsync cannot talk to rrsync on the server.
          # Only rsync goes ahead in PATH: all of Homebrew's bin would also put
          # its python3 ahead of the one set up above.
          brew install --quiet rsync xz
          echo "$(brew --prefix rsync)/bin" >> "$GITHUB_PATH"
          # The image's Homebrew rustup: its rustc shim, run by mach before
          # bootstrap.sh installs Rust, half-installs a toolchain into our
          # RUSTUP_HOME and rustup-init then fails on it.
          brew uninstall --quiet --ignore-dependencies rustup rust 2>/dev/null || true
          rm -rf ~/.cargo ~/.rustup
          command -v rustup rustc cargo || echo "no other Rust on PATH"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /Volumes/ffbuild/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ github.job }}-

      - name: Fetch Firefox, toolchains, patches
        run: |
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        id: build
        # Fails before the job's limit, so the compiler cache is still saved.
        timeout-minutes: 320
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: OPZ_BUILD=full scripts/build.sh

      # Also after a failed or timed-out build: the next run resumes from it.
      # Not from tag runs (their cache is only visible to that tag).
      - name: Stop compiler cache
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: .github/ci-sccache.sh stop

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        uses: actions/cache/save@v4
        with:
          path: /Volumes/ffbuild/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop older compiler caches
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-sccache.sh prune sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: .github/ci-keys.sh mar

      - name: Developer ID and notary keychain
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: .github/ci-keys.sh apple

      - name: Deploy key
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy

      - name: Release
        run: |
          if [ "$PUBLISH" = true ]; then scripts/release.sh --publish; else scripts/release.sh; fi

      # The installer on the version's GitHub Release, for the website's
      # download links (.github/ci-github-release.sh).
      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-github-release.sh

      - name: Remove keychain
        if: always()
        run: |
          [ -z "${OPZ_MAC_NOTARY_KEYCHAIN:-}" ] || security delete-keychain "$OPZ_MAC_NOTARY_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: opz-mac
          path: |
            /Volumes/ffbuild/opz/dist/release/opz-*
            /Volumes/ffbuild/opz/dist/release/site/*/update.xml
          retention-days: 14

  # Windows x64, cross-built on Linux like Mozilla's and Zen's CI (OPZ_TARGET,
  # env.sh / mozconfig.full): several times faster than a Windows runner.
  windows:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPZ_TARGET: win
    defaults:
      run:
        working-directory: /mnt/ffbuild/opz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make room and set up /mnt/ffbuild
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af > /dev/null || true
          df -h / /mnt
          # env.sh wants the build drive mounted at /mnt/ffbuild: bind-mount a
          # directory from whichever disk has more room.
          if [ "$(df -B1 --output=avail /mnt | tail -1)" -gt "$(df -B1 --output=avail / | tail -1)" ]; then
            store=/mnt/ffbuild-store
          else
            store=/home/runner/ffbuild-store
          fi
          sudo mkdir -p "$store" /mnt/ffbuild
          sudo chown "$USER": "$store"
          sudo mount --bind "$store" /mnt/ffbuild
          mkdir -p /mnt/ffbuild/opz
          cp -a "$GITHUB_WORKSPACE/." /mnt/ffbuild/opz/
          sudo apt-get install -y --no-install-recommends xz-utils rsync unzip msitools > /dev/null

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ github.job }}-

      - name: Fetch Firefox, toolchains, patches
        run: |
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        id: build
        # Fails before the job's limit, so the compiler cache is still saved.
        timeout-minutes: 320
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: OPZ_BUILD=full scripts/build.sh

      # Also after a failed or timed-out build: the next run resumes from it.
      # Not from tag runs (their cache is only visible to that tag).
      - name: Stop compiler cache
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          SCCACHE_ERROR_LOG: ${{ runner.temp }}/sccache-error.log
        run: .github/ci-sccache.sh stop

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/ffbuild/cache/sccache
          key: sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop older compiler caches
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && github.ref_type == 'branch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-sccache.sh prune sccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: .github/ci-keys.sh mar

      - name: Deploy key
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy

      - name: Release
        run: |
          if [ "$PUBLISH" = true ]; then scripts/release.sh --publish; else scripts/release.sh; fi

      # The installer on the version's GitHub Release, for the website's
      # download links (.github/ci-github-release.sh).
      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-github-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opz-windows
          path: |
            /mnt/ffbuild/opz/dist/release/opz-*
            /mnt/ffbuild/opz/dist/release/site/*/update.xml
          retention-days: 14
