# Build Opz from scratch on GitHub's runners and release it (scripts/release.sh):
# Linux x86_64 tarball, macOS (Apple Silicon) .dmg and Windows x64 zip, each
# with its signed update (.mar) and update.xml, published to the update server.
# Windows has no rsync: its files are published by the job publish-windows.
#
# Runs when a tag v* is pushed (always publishes), or by hand from the
# Actions tab ("Run workflow"), where publishing is off unless ticked.
# Every run is a full compile of Firefox: expect a few hours per platform.
#
# Secrets (Settings -> Secrets and variables -> Actions); scripts/ci-secrets.sh
# sets them all:
#   MAR_PRIMARY_KEY                 $FFB_ROOT/keys/mar/primary.key.pem (both jobs)
#   MAC_DEVELOPER_ID_P12            Developer ID Application cert + key, base64 .p12
#   MAC_DEVELOPER_ID_P12_PASSWORD   its password
#   APPLE_ID, APPLE_APP_PASSWORD    for notarytool (app-specific password)
#   DEPLOY_SSH_KEY                  key the server accepts for rrsync into
#                                   /srv/opz/updates only (publishing only)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, linux, mac, windows]
        default: all
      publish:
        description: Publish to the update server (installed copies will update)
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time per platform choice, so a manual Linux run does not wait
# hours behind a Windows one (each platform publishes to its own update
# directory). Never cancel a run that may be publishing.
concurrency:
  group: release-${{ github.event_name == 'push' && 'all' || inputs.platforms }}
  cancel-in-progress: false

env:
  # Runners have no separate system disk to protect (env.sh guard).
  OPZ_ROOT_MAX_LOSS_MB: '1000000'
  # No compiler cache: each runner starts empty (mozconfig.full).
  OPZ_NO_SCCACHE: '1'
  # rrsync on the server maps "/" to /srv/opz/updates (see scripts/ci-secrets.sh).
  OPZ_UPDATE_PUBLISH: ubuntu@51.79.223.48:/
  DEPLOY_KNOWN_HOSTS: 51.79.223.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID1/G7CfViHBi6KIFdaRsBCC9J9aOJnGBISN5MlG1u1p
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  linux:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: /mnt/ffbuild/opz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make room and set up /mnt/ffbuild
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af > /dev/null || true
          df -h / /mnt
          # env.sh wants the build drive mounted at /mnt/ffbuild: bind-mount a
          # directory from whichever disk has more room.
          if [ "$(df -B1 --output=avail /mnt | tail -1)" -gt "$(df -B1 --output=avail / | tail -1)" ]; then
            store=/mnt/ffbuild-store
          else
            store=/home/runner/ffbuild-store
          fi
          sudo mkdir -p "$store" /mnt/ffbuild
          sudo chown "$USER": "$store"
          sudo mount --bind "$store" /mnt/ffbuild
          mkdir -p /mnt/ffbuild/opz
          cp -a "$GITHUB_WORKSPACE/." /mnt/ffbuild/opz/
          sudo apt-get install -y --no-install-recommends xz-utils rsync unzip > /dev/null

      - name: Fetch Firefox, toolchains, patches
        run: |
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        run: OPZ_BUILD=full scripts/build.sh

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: .github/ci-keys.sh mar

      - name: Deploy key
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy

      - name: Release
        run: |
          if [ "$PUBLISH" = true ]; then scripts/release.sh --publish; else scripts/release.sh; fi

      - uses: actions/upload-artifact@v4
        with:
          name: opz-linux
          path: |
            /mnt/ffbuild/opz/dist/release/opz-*
            /mnt/ffbuild/opz/dist/release/site/*/update.xml
          retention-days: 14

  mac:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'mac'
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        working-directory: /Volumes/ffbuild/opz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make room and set up /Volumes/ffbuild
        working-directory: /
        run: |
          # Keep only the selected Xcode (codesign, notarytool, stapler).
          keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$keep" ] || [ -L "$x" ] || sudo rm -rf "$x"
          done
          rm -rf ~/Library/Android
          df -h /
          # env.sh wants the repo on a volume under /Volumes.
          hdiutil create -quiet -size 200g -type SPARSE -fs APFS -volname ffbuild "$RUNNER_TEMP/ffbuild"
          hdiutil attach -quiet -nobrowse -mountpoint /Volumes/ffbuild "$RUNNER_TEMP/ffbuild.sparseimage"
          mkdir -p /Volumes/ffbuild/opz
          cp -a "$GITHUB_WORKSPACE/." /Volumes/ffbuild/opz/
          # Real rsync: macOS's openrsync cannot talk to rrsync on the server.
          brew install --quiet rsync xz
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Fetch Firefox, toolchains, patches
        run: |
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        run: OPZ_BUILD=full scripts/build.sh

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: .github/ci-keys.sh mar

      - name: Developer ID and notary keychain
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: .github/ci-keys.sh apple

      - name: Deploy key
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy

      - name: Release
        run: |
          if [ "$PUBLISH" = true ]; then scripts/release.sh --publish; else scripts/release.sh; fi

      - name: Remove keychain
        if: always()
        run: |
          [ -z "${OPZ_MAC_NOTARY_KEYCHAIN:-}" ] || security delete-keychain "$OPZ_MAC_NOTARY_KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: opz-mac
          path: |
            /Volumes/ffbuild/opz/dist/release/opz-*
            /Volumes/ffbuild/opz/dist/release/site/*/update.xml
          retention-days: 14

  windows:
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # MozillaBuild's bash, as its start-shell.bat sets it up: stay in the
      # working directory, keep the Windows PATH (python3, the runner's tools).
      MOZILLABUILD: 'C:\mozilla-build\'
      CHERE_INVOKING: '1'
      MSYS2_PATH_TYPE: inherit
    defaults:
      run:
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - name: Git line endings, Defender
        shell: pwsh
        run: |
          # Scripts and patches must keep LF (the runner's git defaults to CRLF).
          git config --global core.autocrlf false
          git config --global core.longpaths true
          # Real-time scanning slows a Firefox build down a lot.
          try {
            Add-MpPreference -ExclusionPath 'C:\ffbuild', 'C:\mozilla-build', $env:GITHUB_WORKSPACE
            Set-MpPreference -DisableRealtimeMonitoring $true
          } catch { Write-Host "Defender: $_" }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

      - uses: actions/checkout@v4

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup.exe'
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          Get-Content 'C:\mozilla-build\VERSION'
          # python3 for mach and the scripts; openssl from Git (a native build,
          # so it does not mix with MozillaBuild's MSYS2), last in PATH.
          'C:\mozilla-build\bin', 'C:\mozilla-build\python3' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "OPENSSL_DIR_FOR_OPZ=C:\Program Files\Git\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Tools check
        run: |
          export PATH="$PATH:$(cygpath -u "$OPENSSL_DIR_FOR_OPZ")"
          echo "PATH_APPEND=$(cygpath -u "$OPENSSL_DIR_FOR_OPZ")" >> "$GITHUB_ENV"
          uname -a; python3 --version; openssl version; command -v xz rsync || true

      - name: Fetch Firefox, toolchains, patches
        run: |
          export PATH="$PATH:$PATH_APPEND"
          scripts/fetch.sh
          OPZ_BUILD=full scripts/bootstrap.sh
          scripts/apply.sh

      - name: Build
        run: |
          export PATH="$PATH:$PATH_APPEND"
          OPZ_BUILD=full scripts/build.sh

      - name: MAR signing key
        env:
          MAR_PRIMARY_KEY: ${{ secrets.MAR_PRIMARY_KEY }}
        run: |
          export PATH="$PATH:$PATH_APPEND"
          .github/ci-keys.sh mar

      - name: Release (zip, MAR, update.xml)
        run: |
          export PATH="$PATH:$PATH_APPEND"
          scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opz-windows
          path: dist/release/opz-*.win64.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: opz-windows-site
          path: dist/release/site/
          retention-days: 14

  publish-windows:
    needs: windows
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opz-windows-site
          path: site
      - name: Deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/ci-keys.sh deploy
      - name: Publish
        run: scripts/publish.sh site
